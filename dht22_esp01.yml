substitutions:
  device_base_name: "dht22-esp01"
  device_friendly_name: "DHT22 ESP-01"
  setup_ap_ssid: "DHT22 ESP01 Setup"

esphome:
  name: ${device_base_name}
  name_add_mac_suffix: true
  friendly_name: ${device_friendly_name}
  project:
    name: "hugo.dht22-esp01"
    version: "1.2.0"

esp8266:
  board: esp01_1m
  # DO NOT add `restore_from_flash: true` — CONFIRMED to brick this ESP-01.
  # See CLAUDE.md "DANGER" section. Tested on a single device (10.0.10.47),
  # bricked hard at boot before safe_mode could recover it.

logger:
  level: INFO

api:
  # Self-heal: if HA hasn't been connected for 15 min, reboot. Was 0s (= never
  # reboot), which is why a hung device stayed silent until a manual power cycle.
  reboot_timeout: 15min

ota:
  - platform: esphome

# NOTE: no `web_server` — it is the heaviest component for the ESP8266's heap
# (AsyncWebServer + JSON + an event-source connection per open browser tab) and
# was the main cause of devices dropping off. Entities are managed from Home
# Assistant; the captive portal still provides first-time Wi-Fi provisioning.

wifi:
  # No `fast_connect` — it locks onto the stored BSSID without scanning, so a
  # device keeps retrying an AP that moved/rebooted instead of picking the best one.
  power_save_mode: none
  reboot_timeout: 15min

  ap:
    ssid: ${setup_ap_ssid}

captive_portal:

text:
  - platform: template
    name: "Location"
    id: location
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    entity_category: config
    icon: "mdi:map-marker"

number:
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset
    min_value: -50
    max_value: 50
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 0.0
    entity_category: config

  - platform: template
    name: "Humidity Offset"
    id: humidity_offset
    min_value: -50
    max_value: 50
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 0.0
    entity_category: config

sensor:
  - platform: dht
    pin: GPIO2
    model: DHT22
    temperature:
      name: "Temperature"
      id: temperature
      device_class: temperature
      state_class: measurement
      filters:
        - lambda: return x + id(temperature_offset).state;
    humidity:
      name: "Humidity"
      id: humidity
      device_class: humidity
      state_class: measurement
      filters:
        - lambda: return x + id(humidity_offset).state;
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    icon: "mdi:wifi"

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    icon: "mdi:timer-outline"

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
      icon: "mdi:ip-network"
    ssid:
      name: "SSID"
      entity_category: diagnostic
      icon: "mdi:wifi-settings"

button:
  - platform: restart
    name: "Restart device"
    icon: "mdi:restart"
